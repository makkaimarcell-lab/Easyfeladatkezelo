
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="nyelvvalto">
        <label for="nyelvValaszto" data-i18n="language">Nyelv:</label>

        <select id="nyelvValaszto">
            <option value="hu">🇭🇺 Magyar</option>
            <option value="en">🇬🇧 English</option>
            <option value="pl">🇵🇱 Polski</option>
        </select>
    </div>

    <h1 data-i18n="title">Teendőim</h1>

    <button id="belepesBtn" data-i18n="login">
        Bejelentkezés Google-fiókkal
    </button>

    <button id="kijelentkezesBtn" data-i18n="logout">
        Kijelentkezés
    </button>

    <p id="felhasznaloNev"></p>

    <p data-i18n="welcome">
        Üdvözöllek a teendőkezelő oldalon!
    </p>

    <div class="kartya">
        <h2 data-i18n="privateTitle">Saját teendőim</h2>

        <ul id="teendoLista"></ul>

        <button id="ujTeendoBtn" data-i18n="privateAdd">
            + Új saját teendő
        </button>
    </div>

    <div class="kartya">
        <h2 data-i18n="sharedTitle">Közös teendők</h2>

        <ul id="teendoLista2"></ul>

        <button id="ujTeendoBtn2" data-i18n="sharedAdd">
            + Új közös teendő
        </button>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
